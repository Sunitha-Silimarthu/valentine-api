
<!DOCTYPE html>
<html>
<head>
<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff0f5;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

.container{
    text-align:center;
}

button{
    padding:12px 24px;
    font-size:18px;
    border:none;
    border-radius:25px;
    cursor:pointer;
    background:#ff4d88;
    color:white;
}

.kiss{
    position:absolute;
    font-size:32px;
    animation:floatUp 3s linear forwards;
}

@keyframes floatUp{
    0%{
        opacity:1;
        transform:translateY(0) scale(1);
    }
    100%{
        opacity:0;
        transform:translateY(-400px) scale(1.8);
    }
}

#message{
    margin-top:20px;
    font-size:24px;
    color:#ff4d88;
    display:none;
}
</style>
</head>

<body>
<div class="container">
    <h2>HeLLo MR Rahul 😴 Sleep Alert 😴</h2>
    <button onclick="sendKisses()">Click Me ❤️</button>
    <div id="message">😘 Emergency Kiss Delivered 😘</div>
</div>

<script>
function sendKisses(){
    document.getElementById("message").style.display="block";

    for(let i=0;i<25;i++){
        let kiss=document.createElement("div");
        kiss.innerHTML="💋";
        kiss.className="kiss";

        kiss.style.left=(Math.random()*window.innerWidth)+"px";
        kiss.style.bottom="0px";

        document.body.appendChild(kiss);

        setTimeout(()=>{
            kiss.remove();
        },3000);
    }
}
</script>
</body>
</html>
