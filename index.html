
<!DOCTYPE html>
<html>
<head>
<style>
body{
    margin:0;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(to bottom,#fff0f5,#ffe4ec);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
}

.container{
    text-align:center;
    z-index:10;
}

button{
    padding:15px 30px;
    font-size:20px;
    border:none;
    border-radius:30px;
    background:#ff4d88;
    color:white;
    cursor:pointer;
}

#message{
    display:none;
    margin-top:20px;
    font-size:28px;
    color:#ff4d88;
    font-weight:bold;
}

.kiss{
    position:absolute;
    bottom:-50px;
    font-size:35px;
    pointer-events:none;
    animation:floatUp 4s linear forwards;
}

@keyframes floatUp{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:1;
    }
    100%{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">
    <button onclick="startLove()">Sleepy alert ❤️</button>
    <div id="message">
        😘 Emergency Kiss Delivered to my sleepy Swammyyyyy 😘
    </div>
</div>

<script>
let started = false;

function createKiss(){
    const kiss = document.createElement("div");
    kiss.className = "kiss";
    kiss.innerHTML = "😘";

    kiss.style.left = Math.random() * window.innerWidth + "px";
    kiss.style.fontSize = (25 + Math.random()*25) + "px";

    document.body.appendChild(kiss);

    setTimeout(() => {
        kiss.remove();
    }, 4000);
}

function startLove(){
    if(started) return;
    started = true;

    document.getElementById("message").style.display = "block";

    // Continuous kiss shower
    setInterval(createKiss, 150);
}
</script>

</body>
</html>
